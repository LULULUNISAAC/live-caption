<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Caption Translator</title>
<style>
:root{
  --bg:#0f1115; --panel:#1a1d24; --text:#f2f3f5; --muted:#9aa1ac;
  --accent:#5b8cff; --accent2:#2ecf9a; --border:#2a2e37;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8; --panel:#ffffff; --text:#161a20; --muted:#5b6270;
    --accent:#3562e0; --accent2:#1a9c6f; --border:#e3e5ea;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#1a1d24; --text:#f2f3f5; --muted:#9aa1ac;
  --accent:#5b8cff; --accent2:#2ecf9a; --border:#2a2e37;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; min-height:100%;
}
header{
  padding:14px 16px calc(10px + env(safe-area-inset-top,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;
}
header h1{font-size:16px; margin:0; font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--accent2); box-shadow:0 0 0 4px rgba(46,207,154,.15)}
main{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;}
.controls{
  display:flex; flex-wrap:wrap; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border);
  background:var(--panel);
}
select, button{
  font-size:14px; padding:8px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-family:inherit;
}
button#toggleBtn{
  background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer;
  min-width:110px;
}
button#toggleBtn.recording{background:#e0473f;}
.field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted)}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px;
  animation:in .15s ease-out;
}
@keyframes in{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
.card .orig{font-size:15px; color:var(--muted); margin-bottom:6px;}
.card .trans{font-size:18px; line-height:1.4;}
.interim{opacity:.55; font-style:italic;}
.empty{color:var(--muted); text-align:center; margin-top:40px; font-size:14px; padding:0 20px;}
footer{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); font-size:12px; color:var(--muted); border-top:1px solid var(--border);}
.warn{background:#3a2b12; color:#ffd48a; border:1px solid #5c4419; border-radius:10px; padding:10px 14px; font-size:13px; margin:12px 16px 0;}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Live Caption Translator</h1>
</header>

<div class="controls">
  <div class="field">
    Speaking in
    <select id="srcLang">
      <option value="zh-HK" selected>Cantonese (廣東話)</option>
      <option value="zh-CN">Mandarin (普通话)</option>
      <option value="en-US">English</option>
      <option value="ja-JP">Japanese</option>
      <option value="ko-KR">Korean</option>
      <option value="es-ES">Spanish</option>
      <option value="fr-FR">French</option>
      <option value="vi-VN">Vietnamese</option>
      <option value="th-TH">Thai</option>
    </select>
  </div>
  <div class="field">
    Translate to
    <select id="tgtLang">
      <option value="English" selected>English</option>
      <option value="Traditional Chinese">Traditional Chinese</option>
      <option value="Simplified Chinese">Simplified Chinese</option>
      <option value="Spanish">Spanish</option>
      <option value="French">French</option>
      <option value="Japanese">Japanese</option>
      <option value="Korean">Korean</option>
      <option value="Vietnamese">Vietnamese</option>
      <option value="Tagalog">Tagalog</option>
    </select>
  </div>
  <div class="field">&nbsp;
    <button id="toggleBtn">Start</button>
  </div>
  <div class="field">&nbsp;
    <button id="clearBtn">Clear</button>
  </div>
</div>

<div class="controls" style="border-top:none;">
  <div class="field" style="flex:1; min-width:220px;">
    Translation engine
    <select id="engineSel">
      <option value="mymemory" selected>Free (MyMemory, no key)</option>
      <option value="google">Google Cloud Translate (API key)</option>
    </select>
  </div>
  <div class="field" style="flex:1; min-width:220px;" id="keyField">
    Google API key (only if selected above)
    <input id="apiKey" type="password" placeholder="paste key here" style="font-size:14px; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
  </div>
</div>

<main id="feed">
  <div class="empty" id="emptyMsg">Press Start and speak. Captions and translation will appear here live.</div>
</main>

<div class="controls" style="border-top:1px solid var(--border); flex-direction:column; align-items:stretch;">
  <div class="field" style="font-size:13px; color:var(--muted);">Or type/paste text to translate (no mic needed — works on any device)</div>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <textarea id="manualText" rows="2" placeholder="Type or paste text here…" style="flex:1; min-width:200px; font-size:15px; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; resize:vertical;"></textarea>
    <button id="manualTranslateBtn" style="background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; align-self:flex-start;">Translate</button>
  </div>
  <div id="manualResult" class="card" style="display:none; margin-top:4px;"></div>
</div>

<footer id="statusLine">Ready.</footer>

<script>
let recognition = null;
let recognizing = false;

const engineSel = document.getElementById('engineSel');
const apiKeyInput = document.getElementById('apiKey');

const LANG_TO_ISO = {
  'zh-HK': 'zh', 'zh-CN': 'zh', 'en-US': 'en', 'ja-JP': 'ja',
  'ko-KR': 'ko', 'es-ES': 'es', 'fr-FR': 'fr', 'vi-VN': 'vi', 'th-TH': 'th'
};
const TARGET_TO_ISO = {
  'English': 'en', 'Traditional Chinese': 'zh-TW', 'Simplified Chinese': 'zh-CN',
  'Spanish': 'es', 'French': 'fr', 'Japanese': 'ja', 'Korean': 'ko',
  'Vietnamese': 'vi', 'Tagalog': 'tl'
};

const feed = document.getElementById('feed');
const emptyMsg = document.getElementById('emptyMsg');
const toggleBtn = document.getElementById('toggleBtn');
const clearBtn = document.getElementById('clearBtn');
const dot = document.getElementById('dot');
const statusLine = document.getElementById('statusLine');
const srcLangSel = document.getElementById('srcLang');
const tgtLangSel = document.getElementById('tgtLang');

let interimCard = null;

function getRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = srcLangSel.value;
  return r;
}

function addFinalCard(originalText) {
  if (emptyMsg) emptyMsg.remove();
  const card = document.createElement('div');
  card.className = 'card';
  const orig = document.createElement('div');
  orig.className = 'orig';
  orig.textContent = originalText;
  const trans = document.createElement('div');
  trans.className = 'trans';
  trans.textContent = '…';
  card.appendChild(orig);
  card.appendChild(trans);
  feed.appendChild(card);
  feed.scrollTop = feed.scrollHeight;

  translate(originalText, trans);
}

async function translate(text, targetEl) {
  const engine = engineSel.value;
  const sourceIso = LANG_TO_ISO[srcLangSel.value] || 'en';
  const targetName = tgtLangSel.value;
  const targetIso = TARGET_TO_ISO[targetName] || 'en';

  try {
    if (engine === 'google') {
      const key = apiKeyInput.value.trim();
      if (!key) { targetEl.textContent = '(add a Google API key above)'; return; }
      const resp = await fetch(`https://translation.googleapis.com/language/translate/v2?key=${encodeURIComponent(key)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ q: text, source: sourceIso.split('-')[0], target: targetIso.split('-')[0], format: 'text' })
      });
      const data = await resp.json();
      if (data.error) { targetEl.textContent = '(Google API error: ' + data.error.message + ')'; return; }
      targetEl.textContent = data.data.translations[0].translatedText;
    } else {
      const langpair = `${sourceIso}|${targetIso.split('-')[0]}`;
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;
      const resp = await fetch(url);
      const data = await resp.json();
      targetEl.textContent = (data.responseData && data.responseData.translatedText) || '(no translation)';
    }
  } catch (e) {
    targetEl.textContent = '(translation failed — check connection)';
  }
  feed.scrollTop = feed.scrollHeight;
}

function updateInterim(text) {
  if (!text) {
    if (interimCard) { interimCard.remove(); interimCard = null; }
    return;
  }
  if (emptyMsg) emptyMsg.remove();
  if (!interimCard) {
    interimCard = document.createElement('div');
    interimCard.className = 'card interim';
    feed.appendChild(interimCard);
  }
  interimCard.textContent = text;
  feed.scrollTop = feed.scrollHeight;
}

function start() {
  recognition = getRecognition();
  if (!recognition) {
    statusLine.textContent = 'Speech recognition is not supported in this browser. Try Chrome on desktop or Android.';
    return;
  }
  recognition.lang = srcLangSel.value;

  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const res = event.results[i];
      if (res.isFinal) {
        updateInterim('');
        addFinalCard(res[0].transcript.trim());
      } else {
        interim += res[0].transcript;
      }
    }
    updateInterim(interim.trim());
  };

  recognition.onerror = (e) => {
    statusLine.textContent = 'Mic/recognition error: ' + e.error + '. Tap Start to retry.';
  };

  recognition.onend = () => {
    if (recognizing) {
      // auto-restart for continuous listening
      try { recognition.start(); } catch (e) {}
    } else {
      dot.classList.remove('live');
      toggleBtn.textContent = 'Start';
      toggleBtn.classList.remove('recording');
      statusLine.textContent = 'Stopped.';
    }
  };

  try {
    recognition.start();
    recognizing = true;
    dot.classList.add('live');
    toggleBtn.textContent = 'Stop';
    toggleBtn.classList.add('recording');
    statusLine.textContent = 'Listening in ' + srcLangSel.options[srcLangSel.selectedIndex].text + '…';
  } catch (e) {
    statusLine.textContent = 'Could not start microphone: ' + e.message;
  }
}

function stop() {
  recognizing = false;
  if (recognition) {
    try { recognition.stop(); } catch (e) {}
  }
}

toggleBtn.addEventListener('click', () => {
  if (recognizing) stop(); else start();
});

clearBtn.addEventListener('click', () => {
  feed.innerHTML = '';
  const e = document.createElement('div');
  e.className = 'empty';
  e.id = 'emptyMsg';
  e.textContent = 'Press Start and speak. Captions and translation will appear here live.';
  feed.appendChild(e);
});

srcLangSel.addEventListener('change', () => {
  if (recognizing) { stop(); setTimeout(start, 300); }
});

if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) {
  statusLine.textContent = 'Speech recognition not supported in this browser — try Chrome, or use the text box below.';
}

const manualText = document.getElementById('manualText');
const manualBtn = document.getElementById('manualTranslateBtn');
const manualResult = document.getElementById('manualResult');

manualBtn.addEventListener('click', async () => {
  const text = manualText.value.trim();
  if (!text) return;
  manualResult.style.display = 'block';
  manualResult.innerHTML = '<div class="orig"></div><div class="trans">…</div>';
  const origEl = manualResult.querySelector('.orig');
  const transEl = manualResult.querySelector('.trans');
  origEl.textContent = text;
  await translate(text, transEl);
});
</script>
</body>
</html>
